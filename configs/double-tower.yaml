# 双塔线（dt）的训练配置。迭代编排把它当作"已有的池子"，再把这一轮新产出的数据按
# --data-weight 追加进去（ADR 0021/0023）。
#
# 目前每一轮**只训这一轮的新数据**（datasets 留空），这样"教师变了"是唯一变量：
# 第 1 轮是纯 MCTS-64 教师，第 2 轮是 dt1 模型的 NN-MCTS-256 自对弈，训练数据量都是 100 万条，
# 于是两轮的差别可以直接归到数据质量上。要做多来源混训（新旧数据按权重混合）时，
# 把历史批次列进 datasets 即可——那会把"数据量"一并变成变量，对照要另设。
#
# 架构写在 train 小节里（它是 TrainConfig 的字段）：名字只用于查表，体量由参数决定——
# smnet-b9c64dt = 共 9 个残差块、64 通道、双塔（共享 3 + 每塔 3，ADR 0047）。
train:
  architecture: smnet-b9c64dt
  architecture_params:
    channels: 64
    shared_blocks: 3
    tower_blocks: 3
  # mode 由迭代的 train 步骤决定（价值 run → 策略 run 冻结价值），这里只是单独跑 train 时的兜底。
  mode: value
  epochs: 8
  batch_size: 4096
  lr: 3.0e-4
  val_fraction: 0.05
  seed: 20261007
  device: cuda
  log_every: 200
# datasets: 首轮留空——只有这一轮新产出的数据。
